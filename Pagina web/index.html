<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sist.Postres - Framework Bootstrap</title>

    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

    <!-- 1. Menú de navegación -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark px-3 py-2 sticky-top">
        <div class="container-fluid p-0">
            <a class="navbar-brand fs-5 fw-bold m-0" href="#">SIST.POSTRES</a>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-secondary opacity-75 fw-normal">Admin</span>
                <span class="badge bg-success">Activo</span>
            </div>
        </div>
    </nav>

    <!-- Portada -->
    <div class="portada-container">
        <img src="imagenes/Logo.jpg" alt="Portada Postres" class="img-fluid w-100 object-fit-cover" style="height: 200px;">
    </div>

    <!-- Contenedor Principal -->
    <main class="container my-4">

        <!-- Tarjeta de Postres -->
        <section class="row justify-content-center mb-5">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow-sm text-center border-0 rounded-3">
                    <div class="card-body p-4">
                        <h2 class="card-title fs-4 fw-bold text-navy mb-3">POSTRES</h2>
                        <div class="rounded overflow-hidden mb-3" style="height: 200px;">
                            <img src="Imagenes/A1.png" alt="Sección Postres" class="w-100 h-100 object-fit-cover">
                        </div>
                        <button class="btn btn-dark w-100 fw-bold py-2">Ver Galería</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Panel Interactivo de Pedidos -->
        <section class="card shadow-sm border-0 rounded-3 p-4 mb-5">
            <h3 class="fs-5 fw-bold mb-3 text-navy">Módulo de Pedidos Rápidos</h3>
            <div class="row g-3">
                
                <!-- texto -->
                <div class="col-12 col-md-6">
                    <label for="inputCliente" class="form-label fw-semibold">Nombre del Cliente:</label>
                    <input type="text" id="inputCliente" class="form-control" placeholder="Ej. Brayan Cuenca">
                </div>

                <!-- Control Slider -->
                <div class="col-12 col-md-6">
                    <label for="rangeCantidad" class="form-label fw-semibold">
                        Cantidad de Porciones: <span id="lblCantidad" class="badge bg-dark">10</span>
                    </label>
                    <input type="range" class="form-range" min="1" max="50" id="rangeCantidad" value="10">
                </div>

                <!-- Dos botones -->
                <div class="col-12 d-flex gap-2 mt-3">
                    <button class="btn btn-dark px-4 fw-bold" id="btnProcesar">Procesar Pedido</button>
                    <button class="btn btn-outline-secondary px-4" id="btnLimpiar">Limpiar Datos</button>
                </div>

                <!-- mostrar resultados -->
                <div class="col-12 mt-3">
                    <div class="alert alert-info mb-0" id="areaResultados" role="alert">
                        <strong>Estado del Sistema:</strong> Esperando captura de datos para procesar el pedido.
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección de Módulos (Tarjetas) -->
        <section class="row g-4 justify-content-center">
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm text-center border-0 rounded-3">
                    <div class="card-body p-3 d-flex flex-column">
                        <h2 class="card-title fs-6 fw-bold text-navy mb-3">INVENTARIO</h2>
                        <div class="rounded overflow-hidden mb-3" style="height: 150px;">
                            <img src="Imagenes/Inventario.png" alt="Inventario" class="w-100 h-100 object-fit-cover">
                        </div>
                        <button class="btn btn-dark w-100 fw-bold mt-auto">Acceder</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm text-center border-0 rounded-3">
                    <div class="card-body p-3 d-flex flex-column">
                        <h2 class="card-title fs-6 fw-bold text-navy mb-3">COMPRAS</h2>
                        <div class="rounded overflow-hidden mb-3" style="height: 150px;">
                            <img src="Imagenes/Compras.png" alt="Compras" class="w-100 h-100 object-fit-cover">
                        </div>
                        <button class="btn btn-dark w-100 fw-bold mt-auto">Acceder</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm text-center border-0 rounded-3">
                    <div class="card-body p-3 d-flex flex-column">
                        <h2 class="card-title fs-6 fw-bold text-navy mb-3">VENTAS</h2>
                        <div class="rounded overflow-hidden mb-3" style="height: 150px;">
                            <img src="Imagenes/Ventas.png" alt="Ventas" class="w-100 h-100 object-fit-cover">
                        </div>
                        <button class="btn btn-dark w-100 fw-bold mt-auto">Acceder</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm text-center border-0 rounded-3">
                    <div class="card-body p-3 d-flex flex-column">
                        <h2 class="card-title fs-6 fw-bold text-navy mb-3">CONTABILIDAD</h2>
                        <div class="rounded overflow-hidden mb-3" style="height: 150px;">
                            <img src="Imagenes/Contabilidad.png" alt="Contabilidad" class="w-100 h-100 object-fit-cover">
                        </div>
                        <button class="btn btn-dark w-100 fw-bold mt-auto">Acceder</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS de Interacción Personalizada -->
    <script>
        const inputCliente = document.getElementById('inputCliente');
        const rangeCantidad = document.getElementById('rangeCantidad');
        const lblCantidad = document.getElementById('lblCantidad');
        const btnProcesar = document.getElementById('btnProcesar');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const areaResultados = document.getElementById('areaResultados');

        rangeCantidad.addEventListener('input', (e) => {
            lblCantidad.textContent = e.target.value;
        });

        btnProcesar.addEventListener('click', () => {
            const cliente = inputCliente.value.trim() || 'Cliente No Registrado';
            const porciones = rangeCantidad.value;

            areaResultados.className = 'alert alert-success mb-0';
            areaResultados.innerHTML = `
                <strong>¡Pedido Procesado con Éxito!</strong><br>
                <span> <b>Cliente:</b> ${cliente}</span> | 
                <span> <b>Porciones:</b> ${porciones}</span>
            `;
        });

        btnLimpiar.addEventListener('click', () => {
            inputCliente.value = '';
            rangeCantidad.value = 10;
            lblCantidad.textContent = '10';
            
            areaResultados.className = 'alert alert-info mb-0';
            areaResultados.innerHTML = '<strong>Estado del Sistema:</strong> Esperando captura de datos para procesar el pedido.';
        });
    </script>
</body>

</html>
